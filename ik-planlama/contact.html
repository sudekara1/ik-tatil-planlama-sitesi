<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim | İK Planlama</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="nav-container">
      <a href="index.html" class="brand">İK PLANLAMA</a>
      <nav class="menu">
        <a href="index.html">Anasayfa</a>
        <a href="products.html">Resmi Tatiller</a>
        <a href="planning.html">Planlama</a>
        <a href="about.html">Hakkımızda</a>
        <a href="faq.html">SSS</a>
        <a href="contact.html" class="active">İletişim</a>
      </nav>
    </div>
  </header>

  <main>
    <div style="margin-bottom: 20px;">
      <button class="apple-btn" onclick="goBack()">← Geri Dön</button>
    </div>

    <h1 style="margin-bottom: 30px;">İletişim</h1>

    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
      
      <div class="card-apple" style="flex: 2; min-width: 320px;">
        <h3 style="margin-bottom: 20px;">Bize Ulaşın</h3>
        <form id="contactForm">
          <div style="margin-bottom: 15px;">
            <label for="name" style="display:block; margin-bottom:5px; font-size: 14px; color: #86868b;">Ad Soyad</label>
            <input type="text" class="search-input" id="name" required style="margin: 0; width: 100%; box-sizing: border-box;">
          </div>

          <div style="margin-bottom: 15px;">
            <label for="email" style="display:block; margin-bottom:5px; font-size: 14px; color: #86868b;">E-posta</label>
            <input type="email" class="search-input" id="email" required style="margin: 0; width: 100%; box-sizing: border-box;">
          </div>

          <div style="margin-bottom: 20px;">
            <label for="message" style="display:block; margin-bottom:5px; font-size: 14px; color: #86868b;">Mesajınız</label>
            <textarea id="message" class="search-input" rows="4" required style="margin: 0; width: 100%; border-radius: 12px; resize: none; box-sizing: border-box;"></textarea>
          </div>

          <button type="submit" class="apple-btn" style="width: 100%; background: var(--accent); color: #000; font-weight: 700; border: none; cursor: pointer;">Gönder</button>
        </form>
        <div id="formResult" style="margin-top: 15px;"></div>
      </div>

      <div class="card-apple" style="flex: 1; min-width: 280px; height: fit-content;">
        <h3 style="margin-bottom: 20px;">Bilgiler</h3>
        
        <div style="margin-bottom: 20px;">
          <strong style="color: var(--accent); display: block;">Adres</strong>
          <p style="font-size: 16px;">Karabük Merkez / Türkiye</p>
        </div>

        <div style="margin-bottom: 20px;">
          <strong style="color: var(--accent); display: block;">E-posta</strong>
          <p style="font-size: 16px;">info@ikplanlama.com</p>
        </div>

        <div style="margin-bottom: 20px;">
          <strong style="color: var(--accent); display: block;">Telefon</strong>
          <p style="font-size: 16px;">+90 370 000 00 00</p>
        </div>
        
        <p style="font-size: 13px; color: #86868b; border-top: 1px solid #424245; margin-top: 20px; padding-top: 15px;">
          Mesajlarınıza en kısa sürede dönüş yapılacaktır.
        </p>
      </div>

    </div>
  </main>

   <footer class="footer">
    <p>&copy; 2026 İK Planlama Sistemi. Tüm hakları saklıdır.</p>
  </footer>
  
  <script>
    function goBack() {
      // referrer kontrolü bazen tarayıcı güvenliği nedeniyle boş dönebilir
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    }

    const form = document.getElementById("contactForm");
    const result = document.getElementById("formResult");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      
      // Butonu geçici olarak devre dışı bırak (Çift tıklamayı önlemek için)
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.innerText = "Gönderiliyor...";

      // Başarı simülasyonu
      setTimeout(() => {
        result.innerHTML = `
          <div style="background: rgba(124, 255, 0, 0.1); color: var(--accent); padding: 15px; border-radius: 10px; border: 1px solid var(--accent); font-size: 14px; animation: fadeIn 0.5s;">
            ✓ Mesajınız başarıyla alınmıştır. En kısa sürede dönüş yapılacaktır.
          </div>
        `;
        form.reset();
        btn.disabled = false;
        btn.innerText = "Gönder";
      }, 800);
    });
  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

</body>
</html>
